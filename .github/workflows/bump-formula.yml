name: bump-formula

on:
  workflow_call:
    inputs:
      formula:
        description: Formula name, e.g. clipsy
        required: true
        type: string
    secrets:
      tap-token:
        description: Token with contents:write on luizribeiro/homebrew-tap
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: luizribeiro/homebrew-tap
          token: ${{ secrets.tap-token }}
      - name: Update formula to ${{ github.ref_name }}
        env:
          FORMULA: ${{ inputs.formula }}
          URL: https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz
        run: |
          sha256=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          bin/bump-formula "Formula/$FORMULA.rb" "$URL" "$sha256"
          if git diff --quiet; then
            echo "Formula/$FORMULA.rb is already at $GITHUB_REF_NAME"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$FORMULA ${GITHUB_REF_NAME#v}"
          git pull --rebase
          git push
