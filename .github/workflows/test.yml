name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/bump-formula.sh

  formulae:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
      - name: Install, test and audit every formula
        run: |
          brew trust luizribeiro/tap
          for file in "$(brew --repository luizribeiro/tap)"/Formula/*.rb; do
            formula="luizribeiro/tap/$(basename "$file" .rb)"
            brew install --build-from-source "$formula"
            brew test "$formula"
            brew audit --strict --online "$formula"
          done
